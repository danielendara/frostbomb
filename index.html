<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A procedurally generated snowflake, grown from real crystallography. Refresh for another one." />
    <title>frostbomb — a snowflake, grown from refreshes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="3D procedural snowflake visualization"></canvas>

    <header class="masthead">
      <div class="wordmark" aria-label="frost·bomb">frost<span class="wordmark__accent" aria-hidden="true">·</span>bomb</div>
      <div class="edition" id="edition">Vol. <span id="seed-display" aria-live="polite">·····</span></div>
    </header>

    <aside class="field-notes" id="field-notes">
      <div class="field-notes__header">
        <h2 class="field-notes__label">Growth conditions</h2>
        <button id="lab-toggle" class="lab-toggle" title="Toggle Lab Mode" aria-pressed="false">
          Lab Mode: <span id="lab-status">OFF</span>
        </button>
      </div>

      <dl class="field-notes__list" id="stats-display">
        <div class="field-notes__row"><dt>Temperature</dt><dd id="stat-temp">—</dd></div>
        <div class="field-notes__row"><dt>Supersaturation</dt><dd id="stat-humid">—</dd></div>
        <div class="field-notes__row"><dt>Habit</dt><dd id="stat-habit" aria-live="polite">—</dd></div>
        <div class="field-notes__row"><dt>Branches</dt><dd id="stat-branches">—</dd></div>
      </dl>

      <div class="lab-controls" id="lab-controls" style="display: none;">
        <div id="pane-mount" class="pane-mount" aria-label="Manual growth adjustments"></div>
      </div>
    </aside>

    <footer class="footer">
      <nav class="actions" aria-label="Snowflake actions">
        <div class="actions__group">
          <button class="action-btn action-btn--toggle active" id="btn-bloom" title="Toggle frosty bloom effect" aria-pressed="true">
            <span class="action-btn__icon" aria-hidden="true">✨</span>
            <span class="action-btn__label">Bloom</span>
          </button>
          <button class="action-btn action-btn--toggle active" id="btn-rotate" title="Toggle auto-rotation" aria-pressed="true">
            <span class="action-btn__icon" aria-hidden="true">⟳</span>
            <span class="action-btn__label">Auto-Rotate</span>
          </button>
        </div>
        <div class="actions__divider" role="separator" aria-orientation="vertical"></div>
        <button class="action-btn" id="btn-copy" title="Copy share link">
          <span class="action-btn__icon" aria-hidden="true">⎘</span>
          <span class="action-btn__label">Copy Link</span>
        </button>
        <button class="action-btn" id="btn-save" title="Save as PNG">
          <span class="action-btn__icon" aria-hidden="true">↓</span>
          <span class="action-btn__label">Save PNG</span>
        </button>
        <button class="refresh" id="refresh" title="Grow another snowflake">
          <span class="refresh__icon" aria-hidden="true">↻</span>
          <span class="refresh__label">grow another</span>
        </button>
      </nav>
      <p class="colophon">
        No two are alike. Each crystal follows the Nakaya diagram — the branching habit emerges from temperature and supersaturation at the moment of growth.
      </p>
    </footer>

    <div class="grain" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
