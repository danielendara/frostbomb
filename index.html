<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A procedurally generated snowflake, grown from real crystallography. Refresh for another one." />
    <title>frostbomb — a snowflake, grown from refreshes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header class="masthead">
      <div class="wordmark">frost<span class="wordmark__accent">·</span>bomb</div>
      <div class="edition" id="edition">Vol. <span id="seed-display">·····</span></div>
    </header>

    <aside class="field-notes" id="field-notes">
      <div class="field-notes__header">
        <div class="field-notes__label">Growth conditions</div>
        <button id="lab-toggle" class="lab-toggle" title="Toggle Lab Mode">
          Lab Mode: <span id="lab-status">OFF</span>
        </button>
      </div>

      <dl class="field-notes__list" id="stats-display">
        <div class="field-notes__row"><dt>Temperature</dt><dd id="stat-temp">—</dd></div>
        <div class="field-notes__row"><dt>Supersaturation</dt><dd id="stat-humid">—</dd></div>
        <div class="field-notes__row"><dt>Habit</dt><dd id="stat-habit">—</dd></div>
        <div class="field-notes__row"><dt>Branches</dt><dd id="stat-branches">—</dd></div>
      </dl>

      <div class="lab-controls" id="lab-controls" style="display: none;">
        <div class="lab-control">
          <label for="slider-temp">Temp: <span id="val-temp">-15</span>°C</label>
          <input type="range" id="slider-temp" min="-40" max="0" step="0.5" value="-15">
        </div>
        <div class="lab-control">
          <label for="slider-ss">Humidity: <span id="val-ss">80</span>%</label>
          <input type="range" id="slider-ss" min="0" max="100" step="1" value="80">
        </div>
        <div class="field-notes__row" style="margin-top: 0.5rem;"><dt>Resulting Habit</dt><dd id="lab-habit">—</dd></div>
      </div>
    </aside>

    <footer class="footer">
      <div class="actions">
        <div class="actions__group">
          <button class="action-btn action-btn--toggle active" id="btn-bloom" title="Toggle frosty bloom effect">
            <span class="action-btn__icon">✨</span>
            <span class="action-btn__label">Bloom</span>
          </button>
          <button class="action-btn action-btn--toggle active" id="btn-rotate" title="Toggle auto-rotation">
            <span class="action-btn__icon">⟳</span>
            <span class="action-btn__label">Auto-Rotate</span>
          </button>
        </div>
        <div class="actions__divider"></div>
        <button class="action-btn" id="btn-copy" title="Copy share link">
          <span class="action-btn__icon">⎘</span>
          <span class="action-btn__label">Copy Link</span>
        </button>
        <button class="action-btn" id="btn-save" title="Save as PNG">
          <span class="action-btn__icon">↓</span>
          <span class="action-btn__label">Save PNG</span>
        </button>
        <button class="refresh" id="refresh" title="Grow another snowflake">
          <span class="refresh__icon">↻</span>
          <span class="refresh__label">grow another</span>
        </button>
      </div>
      <p class="colophon">
        No two are alike. Each crystal follows the Nakaya diagram — the branching habit emerges from temperature and supersaturation at the moment of growth.
      </p>
    </footer>

    <div class="grain" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
