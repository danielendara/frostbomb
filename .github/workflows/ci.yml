# CI: default = vitest + smoke Playwright (sequential-smoke); full chromium suite on
# workflow_dispatch (full_e2e input), PR label full-e2e, or diffs touching snowflake/ui/canvas/webgl/export/tests/config.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run full Playwright suite (chromium project)
        type: boolean
        default: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip_playwright: ${{ steps.detect.outputs.skip_playwright }}
      e2e_mode: ${{ steps.detect.outputs.e2e_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FULL_E2E: ${{ github.event.inputs.full_e2e }}
        run: |
          set -euo pipefail

          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FULL_E2E" = "true" ]; then
              args+=(--force-full)
            else
              args+=(--force-smoke)
            fi
            bash scripts/e2e-mode.sh --dispatch "${args[@]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            if jq -e '.pull_request.labels[]? | select(.name == "full-e2e")' "$GITHUB_EVENT_PATH" >/dev/null; then
              args+=(--force-full)
            fi
            bash scripts/e2e-mode.sh --pr "origin/${BASE_REF}" "${args[@]}" >> "$GITHUB_OUTPUT"
          else
            bash scripts/e2e-mode.sh --push >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.changes.outputs.e2e_mode == 'full' && 35 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: AGENTS.md policy
        run: node scripts/check-agents-md.mjs

      - name: Three.js chunk budget
        run: node scripts/check-three-chunk-budget.mjs

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Unit tests
        run: npm run test:unit

      - name: Cache Playwright browsers
        if: needs.changes.outputs.skip_playwright != 'true'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        if: needs.changes.outputs.skip_playwright != 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: E2E smoke (default)
        if: needs.changes.outputs.skip_playwright != 'true' && needs.changes.outputs.e2e_mode == 'smoke'
        run: npm run test:e2e:smoke

      - name: E2E full (on demand)
        if: needs.changes.outputs.skip_playwright != 'true' && needs.changes.outputs.e2e_mode == 'full'
        run: npm run test:e2e:full
