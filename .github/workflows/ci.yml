# CI: default = vitest + smoke Playwright (sequential-smoke); full chromium suite on
# workflow_dispatch (full_e2e input), PR label full-e2e, or diffs touching snowflake/ui/canvas/webgl/export/tests/config.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run full Playwright suite (chromium project)
        type: boolean
        default: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      skip_playwright: ${{ steps.detect.outputs.skip_playwright }}
      e2e_mode: ${{ steps.detect.outputs.e2e_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
          FULL_E2E: ${{ github.event.inputs.full_e2e }}
        run: |
          set -euo pipefail

          skip_playwright=false
          e2e_mode=smoke

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FULL_E2E" = "true" ]; then
              e2e_mode=full
            else
              e2e_mode=smoke
            fi
            echo "skip_playwright=false" >> "$GITHUB_OUTPUT"
            echo "e2e_mode=$e2e_mode" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            mapfile -t changed < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          else
            mapfile -t changed < <(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            if [ "${#changed[@]}" -eq 0 ]; then
              mapfile -t changed < <(git ls-files)
            fi
          fi

          echo "Changed files:"
          printf '  %s\n' "${changed[@]}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if jq -e '.pull_request.labels[]? | select(.name == "full-e2e")' "$GITHUB_EVENT_PATH" >/dev/null; then
              e2e_mode=full
            fi
          fi

          docs_only=true
          dependabot_lock_only=true
          for f in "${changed[@]}"; do
            case "$f" in
              *.md|docs/*|LICENSE) ;;
              *) docs_only=false ;;
            esac

            case "$f" in
              package-lock.json|pnpm-lock.yaml|yarn.lock) ;;
              *) dependabot_lock_only=false ;;
            esac

            if [[ "$f" == src/snowflake/* ]] \
              || [[ "$f" == src/ui/* ]] \
              || [[ "$f" == playwright.config.ts ]] \
              || [[ "$f" == vite.config.ts ]] \
              || { [[ "$f" == src/* ]] && [[ "$f" =~ (canvas|webgl|export) ]]; } \
              || { [[ "$f" == tests/* ]] && [[ "$f" != *.smoke.spec.ts ]]; }; then
              e2e_mode=full
            fi
          done

          if [ "$docs_only" = true ] && [ "${#changed[@]}" -gt 0 ]; then
            skip_playwright=true
          fi

          if [ "$ACTOR" = "dependabot[bot]" ] && [ "$dependabot_lock_only" = true ]; then
            skip_playwright=true
          fi

          echo "skip_playwright=$skip_playwright" >> "$GITHUB_OUTPUT"
          echo "e2e_mode=$e2e_mode" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.changes.outputs.e2e_mode == 'full' && 35 || 20 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Cache Playwright browsers
        if: needs.changes.outputs.skip_playwright != 'true'
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        if: needs.changes.outputs.skip_playwright != 'true'
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: E2E smoke (default)
        if: needs.changes.outputs.skip_playwright != 'true' && needs.changes.outputs.e2e_mode == 'smoke'
        run: npm run test:e2e:smoke

      - name: E2E full (on demand)
        if: needs.changes.outputs.skip_playwright != 'true' && needs.changes.outputs.e2e_mode == 'full'
        run: npm run test:e2e:full
