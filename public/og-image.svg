<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">frostbomb</title>
  <desc id="desc">A luminous procedural snowflake on a dark midnight field.</desc>
  <defs>
    <radialGradient id="sky" cx="72%" cy="38%" r="72%">
      <stop offset="0" stop-color="#19355a"/>
      <stop offset="0.42" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#050912"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dceeff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#9ec9ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9ec9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="crystal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="arm" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0 L0 -182" stroke="#dceeff" stroke-width="7"/>
      <path d="M0 -35 L-48 -82 M0 -35 L48 -82 M0 -72 L-70 -137 M0 -72 L70 -137 M0 -116 L-58 -172 M0 -116 L58 -172" stroke="#9ec9ff" stroke-width="5"/>
      <path d="M0 -52 L-32 -52 M0 -52 L32 -52 M0 -103 L-45 -103 M0 -103 L45 -103 M0 -151 L-28 -151 M0 -151 L28 -151" stroke="#ffc78a" stroke-width="3"/>
      <circle cx="0" cy="-182" r="7" fill="#dceeff" stroke="none"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <path d="M0 484 C176 422 248 555 419 491 S716 377 898 461 S1082 532 1200 462" fill="none" stroke="#9ec9ff" stroke-opacity="0.12" stroke-width="1"/>
  <path d="M0 515 C181 453 276 584 430 513 S749 401 930 490 S1107 555 1200 505" fill="none" stroke="#9ec9ff" stroke-opacity="0.09" stroke-width="1"/>
  <g fill="#9ec9ff" opacity="0.55">
    <circle cx="72" cy="102" r="2"/><circle cx="139" cy="210" r="1.5"/><circle cx="222" cy="112" r="1"/><circle cx="289" cy="322" r="2"/>
    <circle cx="375" cy="174" r="1.5"/><circle cx="454" cy="90" r="1"/><circle cx="531" cy="260" r="2"/><circle cx="618" cy="132" r="1"/>
    <circle cx="748" cy="86" r="1.5"/><circle cx="829" cy="210" r="1"/><circle cx="1018" cy="124" r="2"/><circle cx="1120" cy="262" r="1.5"/>
  </g>
  <g opacity="0.35" filter="url(#soft)">
    <circle cx="845" cy="320" r="250" fill="url(#glow)"/>
  </g>

  <g transform="translate(864 320)" filter="url(#crystal)">
    <circle r="78" fill="url(#glow)" opacity="0.7"/>
    <polygon points="0,-39 34,-20 34,20 0,39 -34,20 -34,-20" fill="#0b1728" stroke="#dceeff" stroke-width="6"/>
    <use href="#arm" transform="rotate(0)"/>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>

  <g transform="translate(82 98)">
    <text fill="#e6edf5" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-style="italic" font-weight="300" letter-spacing="-3">frost<tspan fill="#9ec9ff" font-style="normal">·</tspan>bomb</text>
    <text y="58" fill="#8a9bb0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="5">SNOWFLAKE GENERATOR</text>
    <line y1="102" x2="476" y2="102" stroke="#e6edf5" stroke-opacity="0.22"/>
    <text y="157" fill="#e6edf5" font-family="Georgia, 'Times New Roman', serif" font-size="39">A snowflake, grown from refreshes.</text>
    <text y="203" fill="#8a9bb0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">PROCEDURAL CRYSTALLOGRAPHY / NO TWO ALIKE</text>
  </g>

  <text x="82" y="566" fill="#8a9bb0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">FROSTBOMB.COM</text>
</svg>
